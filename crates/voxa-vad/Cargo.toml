[package]
name = "voxa-vad"
description = "Silero voice activity detection for Voxa's silence trimming. Loads a pinned onnxruntime.dll at runtime."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
voxa-core = { path = "../voxa-core" }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray", "std"] }
ndarray = "0.16"

[dev-dependencies]
hound = "3.5"
