# Fixture for release-feed-guard and release-android-signing: every Bad line is caught.
# Bad: no tag ref check, no forward-only version check, no trap for k.pem, no empty-secret check,
# and no pinned release certificate (it signs whatever certificate the APK carries).
name: android-feed
on:
  workflow_dispatch:
jobs:
  feed:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Sign the feed
        run: |
          printf '%s' "$VOXA_UPDATE_KEY" > k.pem
          openssl pkeyutl -sign -rawin -inkey k.pem -in payload.json -out payload.sig
          rm -f k.pem
