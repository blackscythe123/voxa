# Fixture for tools/lint (release-version-sync): no version define for ISCC and no tag check (2 Bad).
jobs:
  windows:
    steps:
      - run: ISCC.exe /Q desktop\windows\voxa.iss
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "Voxa"   # Bad: release-latest (not a prerelease)
      - run: gh release create "$GITHUB_REF_NAME" dist/* --prerelease --latest=false   # Good
