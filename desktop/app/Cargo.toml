[package]
name = "voxa-desktop"
description = "Voxa for Windows: the GPUI recording strip and tray, driven by voxa-core."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
log = "0.4"
voxa-core = { path = "../../core/voxa-core" }
voxa-chatgpt = { path = "../../core/voxa-chatgpt" }
voxa-vad = { path = "../../core/voxa-vad" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
png = "0.17"
unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["ico", "png", "webp", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
cpal = "0.15"
hound = "3.5"
gpui = "0.2.2"
raw-window-handle = "0.6"
global-hotkey = "0.10.0"
tray-icon = "0.26.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Power",
  "Win32_UI_HiDpi",
  "Win32_Security",
] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_System_Diagnostics_ToolHelp", "Foundation", "UI_Notifications", "Data_Xml_Dom"] }
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
cocoa = "0.26"
core-graphics = "0.24"
core-foundation = "0.10"
# Already in the build through cocoa; used for the notification completion handlers.
block = "0.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
