[package]
name = "voxa-chatgpt"
description = "ChatGPT session check and speech-to-text, through the user's own ChatGPT session."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["rustls"]
rustls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
voxa-core = { path = "../voxa-core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
