[package]
name = "voxa-strip-spike"
version = "0.1.0"
edition = "2024"
publish = false

# Spike: can GPUI host Voxa's desktop strip on Windows?
# Go/no-go: non-activating topmost overlay that keeps focus in the target app when clicked,
# global hotkey, tray icon with status, paste into the target app with clipboard restore.

[dependencies]
global-hotkey = "0.10.0"
gpui = "0.2.2"
raw-window-handle = "0.6"
tray-icon = "0.26.1"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_Graphics_Dwm",
] }
