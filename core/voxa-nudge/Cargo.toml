[package]
name = "voxa-nudge"
description = "Voxa's come back reminder engine: hard rules keep it polite and a usual hour rule decides when; an evolved network and a Thompson sampling bandit stay as an experiment behind a switch."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# src/bin/train.rs evolves the model in the simulator:
#   cargo run -p voxa-nudge --release --bin train

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
