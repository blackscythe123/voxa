# Signs the Android update feed (android.json) for an Android release the owner built and
# uploaded by hand (android/release.ps1 prints the steps). Run it from the Actions tab with the
# release tag, for example android-v1.0.0. It is the only place the Android feed is signed:
# VOXA_UPDATE_KEY lives in the protected "release" environment (docs/update-keys.md).
#
# The feed lists one entry per ABI APK found in the release (android-arm64-v8a is required;
# android-armeabi-v7a and android-x86_64 when present) and the universal APK as the fallback
# for every other phone. The app picks by Build.SUPPORTED_ABIS, then the universal one.
name: android-feed

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Android release tag (android-vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like android-v1.0.0, got $TAG"; exit 1; }

      - name: Download the APKs from the release
        run: |
          set -euo pipefail
          V="${TAG#android-v}"
          mkdir -p dist
          gh release download "$TAG" -p "Voxa-Android-$V-*.apk" -D dist
          ls -l dist

      - name: Build the android payload
        run: |
          set -euo pipefail
          V="${TAG#android-v}"
          R="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$((MA * 10000 + MI * 100 + PA))
          arm="dist/Voxa-Android-$V-arm64-v8a.apk"
          [ -f "$arm" ] || { echo "the release has no $arm (required)"; exit 1; }
          # The versionCode inside the APK must match the tag's scheme (major*10000 + minor*100 + patch).
          got="$("$BT/aapt2" dump badging "$arm" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
          [ "$got" = "$CODE" ] || { echo "versionCode in the APK is $got, the tag says $CODE"; exit 1; }
          # The signing certificate's SHA-256 (the newest signer when the APK carries a v3 lineage).
          # apksigner prints "Signer #1 certificate SHA-256 digest:" or, newer, "V3.0 Signer: certificate SHA-256 digest:".
          SIGNER="$("$BT/apksigner" verify --print-certs "$arm" | grep -m 1 'certificate SHA-256 digest: ' | sed 's/.*SHA-256 digest: //')"
          [ -n "$SIGNER" ] || { echo "could not read the signing certificate"; exit 1; }
          assets='{}'
          for pair in "arm64-v8a:android-arm64-v8a" "armeabi-v7a:android-armeabi-v7a" "x86_64:android-x86_64" "universal:android-universal"; do
            abi="${pair%%:*}"; key="${pair#*:}"
            f="dist/Voxa-Android-$V-$abi.apk"
            [ -f "$f" ] || continue
            assets="$(jq -c --arg k "$key" --arg u "$R/Voxa-Android-$V-$abi.apk" --arg s "$(sha256sum "$f" | cut -d' ' -f1)" \
              --argjson z "$(stat -c%s "$f")" '. + {($k): {url: $u, sha256: $s, size: $z}}' <<< "$assets")"
          done
          jq -n --arg v "$V" --argjson c "$CODE" --argjson s "$(date +%s)" --arg n "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --arg g "$SIGNER" --argjson a "$assets" \
            '{schema:1,channel:"android",serial:$s,version:$v,version_code:$c,notes_url:$n,paused:false,signer_sha256:$g,assets:$a}' \
            | tr -d '\n' > payload.json
          cat payload.json; echo

      - name: Sign the feed
        env:
          VOXA_UPDATE_KEY: ${{ secrets.VOXA_UPDATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$VOXA_UPDATE_KEY" ] || { echo "VOXA_UPDATE_KEY is not set in the release environment"; exit 1; }
          umask 077
          printf '%s' "$VOXA_UPDATE_KEY" > k.pem
          openssl pkeyutl -sign -rawin -inkey k.pem -in payload.json -out payload.sig
          rm -f k.pem
          jq -n --arg p "$(base64 -w0 payload.json)" --arg s "$(base64 -w0 payload.sig)" '{key_id:1,payload:$p,sig:$s}' > android.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify with the shipped verifier
        run: cargo run -q --release -p voxa-update --features sign --bin voxa-update-tool -- verify android.json --channel android

      - name: Publish the feed
        # Last, so the feed never points at assets that are not uploaded yet. update-feed is a
        # prerelease that is never "latest"; only the feed file is replaced.
        run: gh release upload update-feed android.json --clobber

      - name: Fetch it back through the client policy
        run: cargo run -q --release -p voxa-update --features sign --bin voxa-update-tool -- fetch-check --channel android
