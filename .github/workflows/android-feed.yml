# Signs the Android update feed (android.json) for an Android release the owner built and
# uploaded by hand (android/release.ps1 prints the steps). It is the only place the Android feed
# is signed: VOXA_UPDATE_KEY lives in the protected "release" environment (docs/update-keys.md).
#
# Run it FROM THE TAG REF (the release environment only admits v* and android-v* refs):
#   gh workflow run android-feed.yml --ref android-v1.0.0 -f tag=android-v1.0.0
# A run from main is refused by the first step. The feed version only moves forward; `force`
# publishes an older one on purpose (a deliberate rollback release).
#
# The feed lists one entry per ABI APK found in the release (android-arm64-v8a is required;
# android-armeabi-v7a and android-x86_64 when present) and the universal APK as the fallback
# for every other phone. The app picks by Build.SUPPORTED_ABIS, then the universal one.
name: android-feed

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Android release tag (android-vX.Y.Z); run the workflow from this same tag ref"
        required: true
      force:
        description: "Publish even if the feed already offers a newer version (a deliberate rollback)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag and the ref
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like android-v1.0.0, got $TAG"; exit 1; }
          # The release environment only admits tag refs: run from the tag being published.
          [ "$GITHUB_REF" = "refs/tags/$TAG" ] || { echo "run this workflow from the tag ref: gh workflow run android-feed.yml --ref $TAG -f tag=$TAG (got $GITHUB_REF)"; exit 1; }

      - name: Download the APKs from the release
        run: |
          set -euo pipefail
          V="${TAG#android-v}"
          mkdir -p dist
          gh release download "$TAG" -p "Voxa-Android-$V-*.apk" -D dist
          ls -l dist

      - name: Build the android payload
        run: |
          set -euo pipefail
          V="${TAG#android-v}"
          R="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | grep -v rc | sort -V | tail -n 1)"
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$((MA * 10000 + MI * 100 + PA))
          arm="dist/Voxa-Android-$V-arm64-v8a.apk"
          [ -f "$arm" ] || { echo "the release has no $arm (required)"; exit 1; }
          # The versionCode inside the APK must match the tag's scheme (major*10000 + minor*100 + patch).
          got="$("$BT/aapt2" dump badging "$arm" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
          [ "$got" = "$CODE" ] || { echo "versionCode in the APK is $got, the tag says $CODE"; exit 1; }
          # Voxa is signed with one permanent release key (no rotation): every APK must carry
          # exactly the pinned release certificate, and never a test-build key.
          # apksigner prints "Signer #1 certificate SHA-256 digest:" or, newer, "V3.0 Signer: certificate SHA-256 digest:".
          PINNED="$(sed 's/#.*//' android/signing/release-cert.sha256 | tr -d ' \r' | tr 'A-F' 'a-f' | grep -E '^[0-9a-f]{64}$' | head -n 1 || true)"
          [ -n "$PINNED" ] || { echo "android/signing/release-cert.sha256 is empty: commit the release certificate first (docs/update-keys.md)"; exit 1; }
          for f in dist/Voxa-Android-"$V"-*.apk; do
            certs="$("$BT/apksigner" verify --print-certs "$f" | grep 'certificate SHA-256 digest: ' | sed 's/.*SHA-256 digest: //' | tr 'A-F' 'a-f' | sort -u)"
            [ -n "$certs" ] || { echo "could not read the signing certificate of $f"; exit 1; }
            while read -r c; do
              if grep -qix "$c" android/signing/forbidden-signers.txt; then echo "$f is signed by a test-build key ($c)"; exit 1; fi
              [ "$c" = "$PINNED" ] || { echo "$f is signed by $c, not the pinned release certificate $PINNED"; exit 1; }
            done <<< "$certs"
          done
          SIGNER="$PINNED"
          assets='{}'
          for pair in "arm64-v8a:android-arm64-v8a" "armeabi-v7a:android-armeabi-v7a" "x86_64:android-x86_64" "universal:android-universal"; do
            abi="${pair%%:*}"; key="${pair#*:}"
            f="dist/Voxa-Android-$V-$abi.apk"
            [ -f "$f" ] || continue
            assets="$(jq -c --arg k "$key" --arg u "$R/Voxa-Android-$V-$abi.apk" --arg s "$(sha256sum "$f" | cut -d' ' -f1)" \
              --argjson z "$(stat -c%s "$f")" '. + {($k): {url: $u, sha256: $s, size: $z}}' <<< "$assets")"
          done
          jq -n --arg v "$V" --argjson c "$CODE" --argjson s "$(date +%s)" --arg n "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --arg g "$SIGNER" --argjson a "$assets" \
            '{schema:1,channel:"android",serial:$s,version:$v,version_code:$c,notes_url:$n,paused:false,signer_sha256:$g,assets:$a}' \
            | tr -d '\n' > payload.json
          cat payload.json; echo

      - uses: dtolnay/rust-toolchain@stable

      - name: The feed only moves forward
        # Refuses a lower versionCode than the published feed (an old tag's run must never
        # unpublish a newer release) and a serial that doesn't go up, unless `force` is set.
        run: cargo run -q --release -p voxa-update --features sign --bin voxa-update-tool -- guard-forward --channel android --payload payload.json ${{ inputs.force && '--force' || '' }}

      - name: Sign the feed
        env:
          VOXA_UPDATE_KEY: ${{ secrets.VOXA_UPDATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$VOXA_UPDATE_KEY" ] || { echo "VOXA_UPDATE_KEY is not set in the release environment"; exit 1; }
          umask 077
          # The key file never outlives this step, even when openssl fails.
          trap 'rm -f k.pem' EXIT
          printf '%s' "$VOXA_UPDATE_KEY" > k.pem
          openssl pkeyutl -sign -rawin -inkey k.pem -in payload.json -out payload.sig
          jq -n --arg p "$(base64 -w0 payload.json)" --arg s "$(base64 -w0 payload.sig)" '{key_id:1,payload:$p,sig:$s}' > android.json

      - name: Verify with the shipped verifier
        run: cargo run -q --release -p voxa-update --features sign --bin voxa-update-tool -- verify android.json --channel android

      - name: Publish the feed
        # Last, so the feed never points at assets that are not uploaded yet. update-feed is a
        # prerelease that is never "latest"; only the feed file is replaced.
        run: gh release upload update-feed android.json --clobber

      - name: Fetch it back through the client policy
        run: cargo run -q --release -p voxa-update --features sign --bin voxa-update-tool -- fetch-check --channel android
