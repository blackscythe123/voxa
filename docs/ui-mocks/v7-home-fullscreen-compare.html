<!doctype html><meta charset="utf-8"><title>Voxa Home, full screen: old and new for every doodle</title>
<style>
:root{--ink:#7A3F22;--line:#C9A898;--wash:rgba(122,63,34,.10)}
body{margin:0;background:#E7E3DE;font-family:"Segoe UI Variable Text","Segoe UI",sans-serif;color:#1A1A1A}
header{position:sticky;top:0;z-index:5;background:#E7E3DE;padding:14px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #D6D0C9}
header b{margin-right:10px}header button{border:1px solid #CFC8C0;background:#fff;border-radius:16px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}header button.on{background:#7A3F22;color:#fff;border-color:#7A3F22}
.wrap{padding:20px 24px;display:grid;grid-template-columns:auto auto;gap:22px 28px;justify-content:start}
.cap{font-weight:600;margin:0 0 8px;font-size:15px}.cap span{font-weight:400;color:#555;font-size:13px;margin-left:6px}
.frame{background:#fff;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.10);overflow:hidden}
.doodle .s{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.doodle .h{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round}
.doodle .w{fill:var(--wash);stroke:none}.doodle .dot{fill:var(--ink);stroke:none}.doodle .k{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linecap:round;opacity:.7}
.desk{width:1280px;height:800px;transform:scale(.62);transform-origin:0 0;display:flex;background:#FBFAF8}
.dscale{width:794px;height:496px}
.side{width:200px;background:#F1EEEA;padding:22px 10px;box-sizing:border-box}.logo{font-family:Georgia,serif;font-weight:700;font-size:24px;margin:0 0 24px 14px}
.nv{padding:9px 14px;border-radius:6px;font-size:15px}.nv.on{background:#E4DFD9;font-weight:600}
.main{flex:1;padding:22px 34px;box-sizing:border-box;overflow:hidden}
.card{background:#fff;border:1px solid #ECE9E5;border-radius:8px}
.stats{display:flex;gap:10px}.st{flex:1;padding:14px 18px}.st b{font-size:28px;font-weight:600;display:block}.st span{color:#555;font-size:13px}
.help{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}.help b{font-size:16px}.help p{margin:3px 0 0;color:#555;font-size:12.5px}
.key{border:1px solid #CFC9C2;border-bottom-width:3px;border-radius:6px;padding:5px 12px;font-weight:600;margin-left:5px;background:#fff;font-size:14px}
h4{font-size:14px;margin:18px 0 8px;display:flex;justify-content:space-between}h4 a{color:#7A3F22;font-weight:400}
.rw{display:flex;gap:16px;padding:11px 16px;margin-bottom:5px;font-size:14px}.rw i{width:24px;height:24px;border-radius:5px;background:#D97757;flex:none}.rw .m{width:110px;color:#555;font-size:12px}.rw .m b{color:#1A1A1A;display:block}
.oband svg{width:100%;height:112px;display:block}.ogreet{font-size:40px;font-weight:600;margin:8px 0 16px}
.nhero{position:relative;padding:24px 0 8px;display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.nhero .g{font-size:46px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}.nhero svg.fit{height:150px;display:block}
.nhero .ln{position:absolute;left:0;right:0;bottom:6px;height:1.5px;background:var(--line)}
.ph{width:412px;height:900px;transform:scale(.62);transform-origin:0 0;background:#FBFAF8;position:relative;overflow:hidden}
.pscale{width:256px;height:558px}
.sb{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;color:#444}
.av{position:absolute;right:20px;top:58px;width:42px;height:42px;border-radius:50%;background:#2E3A46}
.pband{margin:18px 20px 0}.pband svg{width:100%;height:112px;display:block}.pband svg.fit{width:auto;height:150px;margin:0 auto}
.pg{font-size:38px;font-weight:700;line-height:1.05;margin:12px 22px 0;letter-spacing:-.02em}
.phero{position:relative;margin:58px 20px 0;padding-bottom:8px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.phero .g{font-size:34px;font-weight:700;line-height:1.05;letter-spacing:-.02em;margin-bottom:10px}.phero svg.fit{height:92px;display:block;flex:none}
.phero .ln{position:absolute;left:0;right:0;bottom:6px;height:1.5px;background:var(--line)}
.pcard{margin:20px 20px 0;background:#fff;border-radius:20px;box-shadow:0 2px 16px rgba(40,30,20,.07);padding:20px 24px}

.prec{margin:22px 22px 0;display:flex;justify-content:space-between;font-weight:600;font-size:15px}.prec a{color:#7A3F22}
.prow{margin:14px 22px 0;display:flex;gap:14px;font-size:14px}.prow i{width:28px;height:28px;border-radius:50%;background:#1A73E8;flex:none}
.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:110px;background:#7A3F22;color:#fff;border-radius:28px;padding:14px 28px;font-weight:600}
.pnav{position:absolute;bottom:0;left:0;right:0;height:84px;border-top:1px solid #EEE;display:flex;justify-content:space-around;align-items:center;font-size:12.5px;color:#555;background:#FBFAF8}
</style>

function fit(svg, maxW) {
  svg.querySelectorAll('path.h').forEach(h => h.remove());
  const b = svg.getBBox(), pad = 4;
  svg.setAttribute('viewBox', (b.x - pad) + ' ' + (b.y - pad) + ' ' + (b.width + 2 * pad) + ' ' + (b.height + 2 * pad));
  svg.setAttribute('preserveAspectRatio', 'xMidYMax meet');
  svg.classList.add('fit');
