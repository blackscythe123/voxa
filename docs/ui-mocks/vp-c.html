body{margin:0;width:432px;height:960px;background:#FBFAF8;color:#1A1A1A;font-family:"Segoe UI Variable Text","Segoe UI",sans-serif;position:relative;overflow:hidden}
.sb{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:15px;color:#444}
.av{position:absolute;right:24px;top:66px;width:44px;height:44px;border-radius:50%;background:#2E3A46;display:grid;place-items:center}
.hero{position:relative;margin:40px 24px 0;display:flex;flex-direction:column-reverse;align-items:flex-start}.hero svg{align-self:center;margin-bottom:6px}

.line{position:absolute;left:0;right:0;top:152px;height:1.5px;background:#C9A898}
.card{margin:22px 24px 0;background:#fff;border-radius:22px;box-shadow:0 2px 18px rgba(40,30,20,.07);padding:22px 26px}
.big{font-size:40px;font-weight:700}.sub{color:#555;font-size:14px;margin-top:4px}

.pair{display:flex;border-top:1px solid #EEE;padding-top:14px}.pair div{flex:1;font-size:13px;color:#555}.pair b{display:block;font-size:20px;color:#1A1A1A}
.rec{margin:26px 24px 0;display:flex;justify-content:space-between;font-weight:600}.rec a{color:#7A3F22}
.row{margin:16px 24px 0;display:flex;gap:16px}.ic{width:30px;height:30px;border-radius:50%;background:#1A73E8}.row b{display:block;font-size:14px}.row span{color:#555;font-size:15px}
.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:118px;background:#7A3F22;color:#fff;border-radius:30px;padding:16px 30px;font-weight:600;font-size:17px}
.nav{position:absolute;bottom:0;left:0;right:0;height:96px;border-top:1px solid #EEE;display:flex;justify-content:space-around;align-items:center;font-size:13px;color:#555;background:#FBFAF8}.nav b{color:#1A1A1A}
.note{position:absolute;top:58px;left:24px;font-size:11px;color:#7A3F22;background:#F3E9E3;padding:2px 8px;border-radius:10px}
</style>
